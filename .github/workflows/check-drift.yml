name: Check drift

# grammar/grammar.ebnf is the source for every keyword table in this repo and in
# mvl-lang/tree-sitter-mvl (ADR-0060, mvl-lang/mvl#2050). This job regenerates
# each artifact and fails if the committed version differs.
#
# Without it, `grammar/keywords.yaml` claimed to be the single source of truth for
# three releases while nothing read it — which is how `Public` and `Clean`
# survived two weeks past PR #31 in five separate artifacts. A declared source
# with no failing consumer is a document, not a source.

on:
  push:
    branches: [main]
    paths:
      - "grammar/**"
      - "tools/generators/**"
      - "editors/**"
      - ".github/workflows/check-drift.yml"
  pull_request:
    paths:
      - "grammar/**"
      - "tools/generators/**"
      - "editors/**"
      - ".github/workflows/check-drift.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: generated artifacts match grammar.ebnf
    runs-on: ubuntu-latest
    steps:
      - name: Check out mvl-spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mvl-spec

      # gen_highlights.py and gen_tree_sitter.py write into the grammar repo, so
      # it has to be present as a sibling — the same layout tools/check-versions.py
      # assumes. Without it those two generators skip, and a skipped generator
      # must not read as a pass.
      - name: Check out tree-sitter-mvl as a sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mvl-lang/tree-sitter-mvl
          path: tree-sitter-mvl

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml

      - name: Confirm every generator has a target
        # A generator that silently skips would let drift through. Fail here
        # rather than reporting success on a partial run.
        working-directory: mvl-spec
        run: |
          set -euo pipefail
          test -f ../tree-sitter-mvl/grammar.js \
            || { echo "::error::tree-sitter-mvl checkout missing grammar.js"; exit 1; }
          test -f ../tree-sitter-mvl/queries/highlights.scm \
            || { echo "::error::tree-sitter-mvl checkout missing queries/highlights.scm"; exit 1; }
          echo "both cross-repo targets present"

      - name: check-drift
        working-directory: mvl-spec
        run: tools/generators/check-drift.sh --tree-sitter-dir ../tree-sitter-mvl

      - name: Show what drifted
        if: failure()
        working-directory: mvl-spec
        run: |
          echo "::group::regenerating to show the diff"
          tools/generators/regen-all.sh --tree-sitter-dir ../tree-sitter-mvl || true
          git --no-pager diff --stat
          git --no-pager diff
          echo "::endgroup::"
          echo "::notice::Edit grammar/grammar.ebnf, then run tools/generators/regen-all.sh"

  zed-pin:
    name: Zed's pinned grammar can load Zed's queries
    runs-on: ubuntu-latest
    steps:
      - name: Check out mvl-spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # editors/zed/extension.toml pins tree-sitter-mvl by commit SHA, and Zed
      # fetches the grammar at exactly that revision. If the queries reference a
      # node the pinned grammar does not have, tree-sitter rejects the WHOLE
      # query file and the user loses all highlighting — not just the one rule.
      #
      # That shipped: the pin sat at 009a50a while the regenerated queries
      # referenced "ghost", which only became a token once ghost_let_stmt was
      # wired (mvl-lang/tree-sitter-mvl#3). Symptom was total silence, and the
      # only signal was `Invalid node type "ghost"` from a manual
      # `tree-sitter query` run.
      - name: Read the pinned revision
        id: pin
        run: |
          set -euo pipefail
          rev=$(grep -oE '^rev = "[0-9a-f]{40}"' editors/zed/extension.toml | grep -oE '[0-9a-f]{40}')
          test -n "$rev" || { echo "::error::no 40-char rev in editors/zed/extension.toml"; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "pinned grammar: $rev"

      - name: Check out tree-sitter-mvl at that exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mvl-lang/tree-sitter-mvl
          ref: ${{ steps.pin.outputs.rev }}
          path: grammar-at-pin

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.25.10

      - name: Load Zed's queries against the pinned grammar
        run: |
          set -euo pipefail
          cd grammar-at-pin
          tree-sitter generate
          printf 'fn f() -> Unit { ghost let w: Int = 1; }\n' > /tmp/probe.mvl
          for q in highlights indents; do
            src="../editors/zed/languages/mvl/$q.scm"
            [ -f "$src" ] || continue
            echo "::group::$q.scm"
            if ! tree-sitter query "$src" /tmp/probe.mvl > /tmp/out.txt 2>&1; then
              cat /tmp/out.txt
              echo "::error::editors/zed/languages/mvl/$q.scm does not load against the pinned grammar (${{ steps.pin.outputs.rev }}). Bump rev in editors/zed/extension.toml."
              exit 1
            fi
            echo "$q.scm loads"
            echo "::endgroup::"
          done
          echo "Zed's queries load against the pinned grammar"
