  - String
  - Unit
  - Option
  - Result
  - List
  - Array
  - Map
  - Set

# Ordinary identifiers, pre-seeded into the parser's known-label set.
# There is no `Public` label — unlabeled is public by absence.
stdlib_labels:
  - Tainted
  - Secret
  - ConfigPath
  - DbUrl
  - ApiEndpoint
  - AuditTarget
