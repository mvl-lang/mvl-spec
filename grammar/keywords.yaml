#
# Categories, and what each means for a consumer:
#
#   declaration..refinements   43  RESERVED — the lexer rejects these
#                                  as identifiers.
#   pattern                    4  Constructors, matched as paths. NOT
#                                  lexer keywords.
#   contextual                 5  Special in one syntactic position,
#                                  ordinary identifiers elsewhere. NEVER
#                                  emit these as bare words.
#   builtin_types             23  Reserved by convention only.
#   stdlib_labels              6  Ordinary identifiers.
#
# `len` appears in no category: it is an ordinary identifier naming a
# compiler-known method, which ref_atom admits as len(x) inside predicates.

declaration:
  - fn
  - type
  - const
  - use
  - pub
  - extern
  - impl
  - builtin
  - struct
  - enum
  - actor
  - effect
  - test

totality:
  - total
  - partial

cast:
  - as

control_flow:
  - if
  - else
  - for
  - in
  - while
  - match
  - return
  - select

let_binding:
  - let
  - ghost

ownership:
  - iso
  - val
  - ref
  - tag
  - consume

ifc:
  - label
  - relabel

boolean:
  - "true"
  - "false"

refinements:
  - where
  - requires
  - ensures
  - invariant
  - with
  - decreases
  - forall
  - exists

pattern:
  - Some
  - None
  - Ok
  - Err

# Not reserved. Anchor on the enclosing production, never the bare word —
# a flat list highlights `let end = 5` as a keyword.
contextual:
  - self
  - old
  - end
  - timeout
  - audit

# Not enforced by the lexer; users should not shadow them.
builtin_types:
  - Int
  - Int8
  - Int16
  - Int32
  - Int64
  - UInt8
  - UInt16
  - UInt32
  - UInt64
  - Float
